<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 id="timer">25:00</h1>
            <div class="show-state">
                <p id="state"><strong>Work</strong></p>
            </div>
            <p id="sections">0/4</p>
            <button class="start" id="action">Play</button>
            <br><br>
            <button class="options" id="configs">Settings</button>
            
        </div>
        <div class="content-options" id="content-configs">
            <form id="form-options">
                <br>
                <label for="auto-start">Auto start:</label>
                <br>
                <input type="checkbox" name="auto" id="auto-start">
                <br>
                <label for="auto-start">Pomodoros:</label>
                <br>
                <input type="number" min="1" name="cycles" id="pomodoros" value="4">
                <br><br>
                <label for="auto-start">Min/Pomodoro:</label>
                <br>
                <input type="number" min="1" name="cycles" id="min" value="25">
                <br><br>
                <label for="auto-start">Min/Short Break:</label>
                <br>
                <input type="number" min="1" name="break" id="min-break" value="5">
                <br><br>
                <label for="auto-start">Min/Long Break:</label>
                <br>
                <input type="number" min="1" name="break" id="min-longbreak" value="30">
                <br><br>
                <button type="submit" class="save" id="save">Save</button>
            </form>
        </div>
    </div>
</body>
<script src="script.js"></script>
<script src="configs.js"></script>
</html>
